<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Examplex</title>
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/inner.css">
  <style>
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 40px;
    }
    .contact-info {
      background: var(--color-primary);
      color: white;
      padding: 40px;
      border-radius: 16px;
    }
    .contact-info h3 {
      color: white;
      margin-bottom: 20px;
    }
    .info-item {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .info-item i {
      font-size: 1.5rem;
      color: var(--color-accent);
    }
    .contact-form {
      padding: 40px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    @media (max-width: 768px) {
      .contact-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-left">
        <div class="top-bar-item">
          <i class="ph ph-phone-call"></i>
          <span data-i18n="global.contactInfo.hotline"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo">
        <i class="ph-fill ph-shield-check"></i>
        Examplex
      </a>
      
      <nav class="nav-links">
        <a href="index.html" data-i18n="global.nav.home"></a>
        <a href="about.html" data-i18n="global.nav.about"></a>
        <div class="menu-item-has-children">
          <a href="services.html" data-i18n="global.nav.services"></a>
          <ul class="sub-menu">
            <li><a href="services.html#static-manpower" data-i18n="home.services.items.0.title"></a></li>
            <li><a href="services.html#cash-in-transit" data-i18n="home.services.items.1.title"></a></li>
            <li><a href="services.html#escorting-service" data-i18n="home.services.items.2.title"></a></li>
            <li><a href="services.html#electronic-security" data-i18n="home.services.items.3.title"></a></li>
            <li><a href="services.html#cash-management" data-i18n="home.services.items.4.title"></a></li>
          </ul>
        </div>
        <a href="branches.html" data-i18n="global.nav.branches"></a>
        <a href="careers.html" data-i18n="global.nav.career"></a>
        <a href="contact.html" class="active" data-i18n="global.nav.contact"></a>
      </nav>

      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
          <i class="ph ph-moon"></i>
        </button>
        <button id="lang-toggle" class="lang-switch">বাংলা</button>
        <div id="mobile-toggle" class="mobile-toggle">
          <i class="ph ph-list"></i>
        </div>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="inner-hero">
    <div class="container">
      <h1 data-i18n="global.nav.contact"></h1>
      <div class="breadcrumb">
        <a href="index.html" data-i18n="global.nav.home"></a>
        <i class="ph ph-caret-right"></i>
        <span data-i18n="global.nav.contact"></span>
      </div>
    </div>
  </section>

  <!-- Content -->
  <section class="page-content">
    <div class="container contact-grid">
      <div class="contact-info">
        <h3>Get in Touch</h3>
        <div class="info-item">
          <i class="ph-fill ph-map-pin"></i>
          <div>
            <strong>Head Office</strong>
            <p data-i18n="global.footer.address"></p>
          </div>
        </div>
        <div class="info-item">
          <i class="ph-fill ph-phone"></i>
          <div>
            <strong>Hotline</strong>
            <p data-i18n="global.contactInfo.hotline"></p>
          </div>
        </div>
        <div class="info-item">
          <i class="ph-fill ph-envelope"></i>
          <div>
            <strong>Email</strong>
            <p data-i18n="global.contactInfo.email"></p>
          </div>
        </div>
      </div>
      
      <div class="contact-form">
        <form>
          <div class="form-group">
            <label>Name</label>
            <input type="text" placeholder="Your Name" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Your Email" required>
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea rows="5" placeholder="How can we help you?" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Examplex. All rights reserved.</p>
        <p data-i18n="global.footer.certification"></p>
      </div>
    </div>
  </footer>

  <!-- Floating Action Buttons -->
  <div class="floating-actions">
    <a href="tel:09606773355" class="fab fab-call" aria-label="Call Us">
      <i class="ph-fill ph-phone-call"></i>
    </a>
    <a href="https://wa.me/8801787650583" target="_blank" class="fab fab-whatsapp" aria-label="WhatsApp Us">
      <i class="ph-fill ph-whatsapp-logo"></i>
    </a>
    <a href="#" class="fab fab-top" id="go-to-top" aria-label="Go to Top">
      <i class="ph-bold ph-caret-up"></i>
    </a>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
